
name: Publish Changes
description: Publish GitHub merge history to Confluence

inputs:
  confluence-cloud-id:
    required: true
    description: Confluence Cloud ID of organization

  confluence-space-id:
    required: true
    description: Confluence Space ID

  confluence-parent-page-id:
    required: true
    description: Parent change tracking page ID

  confluence-email:
    required: true
    description: Atlassian account email

  confluence-api-token:
    required: true
    description: Atlassian API token

  github-token:
    required: true
    description: GitHub token

  target-branch:
    required: false
    default: main
    description: Target branch to monitor

runs:
  using: docker
  image: Dockerfile
  env:
    GH_TOKEN: ${{ inputs.github-token }}
    TARGET_BRANCH: ${{ inputs.target-branch }}
    CONFLUENCE_CLOUD_ID: ${{ inputs.confluence-cloud-id }}
    CONFLUENCE_SPACE_ID: ${{ inputs.confluence-space-id }}
    CONFLUENCE_PARENT_PAGE_ID: ${{ inputs.confluence-parent-page-id }}
    CONFLUENCE_EMAIL: ${{ inputs.confluence-email }}
    CONFLUENCE_API_TOKEN: ${{ inputs.confluence-api-token }}
  run: |
    for name in CLOUD_ID SPACE_ID PARENT_ID API_TOKEN; do
      if [ -z "${!name}" ]; then
        echo "::error::$name is missing"
        exit 1
      fi
    done
    echo "All configuration values are present."
