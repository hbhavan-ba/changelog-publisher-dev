
name: Publish Changes
description: Publish GitHub merge history to Confluence

inputs:
  confluence-url:
    required: true
    description: Confluence url of organization

  confluence-space-id:
    required: true
    description: Confluence Space ID

  confluence-parent-page-id:
    required: true
    description: Parent change tracking page ID

  confluence-email:
    required: true
    description: Atlassian account email

  confluence-api-token:
    required: true
    description: Atlassian API token

  github-token:
    required: true
    description: GitHub token

  target-branch:
    required: false
    default: main
    description: Target branch to monitor

runs:
  using: docker
  image: Dockerfile
  env:
    Publisher__GitHubToken: ${{ inputs.github-token }}
    Publisher__Repository: ${{ github.repository }}
    Publisher__CommitSha: ${{ github.sha }}
    Publisher__BeforeSha: ${{ github.event.before }}
    Publisher__TargetBranch: ${{ inputs.target-branch }}

    Publisher__ConfluenceCloudId: ${{ inputs.confluence-cloud-id }}
    Publisher__ConfluenceSpaceId: ${{ inputs.confluence-space-id }}
    Publisher__ConfluenceParentPageId: ${{ inputs.confluence-parent-page-id }}
    Publisher__ConfluenceEmail: ${{ inputs.confluence-email }}
    Publisher__ConfluenceApiToken: ${{ inputs.confluence-api-token }}