
name: Publish Changes
description: Publish GitHub merge history to Confluence

inputs:
  confluence-url:
    required: true
    description: Confluence url of organization

  confluence-space-id:
    required: true
    description: Confluence Space ID

  confluence-parent-page-id:
    required: true
    description: Parent change tracking page ID

  confluence-email:
    required: true
    description: Atlassian account email

  confluence-api-token:
    required: true
    description: Atlassian API token

  github-token:
    required: true
    description: GitHub token

  target-branch:
    required: false
    default: main
    description: Target branch to monitor

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: python -m pip install requests

    - name: Publish Confluence Change Log
      shell: bash
      env:
        CONFLUENCE_URL: ${{ inputs.confluence-url }}
        CONFLUENCE_SPACE_ID: ${{ inputs.confluence-space-id }}
        CONFLUENCE_PARENT_PAGE_ID: ${{ inputs.confluence-parent-page-id }}
        CONFLUENCE_EMAIL: ${{ inputs.confluence-email }}
        CONFLUENCE_API_TOKEN: ${{ inputs.confluence-api-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET_BRANCH: ${{ inputs.target-branch }}
        REPOSITORY: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
        PR_NUMBER: ${{ github.event.number }}
      run: python "${{ github.action_path }}/scripts/publish_changelog.py"
